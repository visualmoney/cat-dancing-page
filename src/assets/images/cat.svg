<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="145" rx="55" ry="50" fill="#F4A261"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="45" fill="#F4A261"/>

  <!-- Left ear -->
  <polygon points="60,45 50,10 80,38" fill="#F4A261"/>
  <polygon points="63,42 55,18 76,38" fill="#E76F51"/>

  <!-- Right ear -->
  <polygon points="140,45 150,10 120,38" fill="#F4A261"/>
  <polygon points="137,42 145,18 124,38" fill="#E76F51"/>

  <!-- Face -->
  <!-- Eyes -->
  <ellipse cx="82" cy="75" rx="10" ry="12" fill="white"/>
  <ellipse cx="118" cy="75" rx="10" ry="12" fill="white"/>
  <ellipse cx="83" cy="76" rx="6" ry="8" fill="#2D3436"/>
  <ellipse cx="119" cy="76" rx="6" ry="8" fill="#2D3436"/>
  <!-- Eye shine -->
  <circle cx="85" cy="73" r="2" fill="white"/>
  <circle cx="121" cy="73" r="2" fill="white"/>

  <!-- Nose -->
  <polygon points="100,88 96,94 104,94" fill="#E76F51"/>

  <!-- Mouth -->
  <path d="M96,94 Q92,100 88,97" stroke="#2D3436" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M104,94 Q108,100 112,97" stroke="#2D3436" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="55" y1="88" x2="90" y2="92" stroke="#2D3436" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="52" y1="95" x2="88" y2="95" stroke="#2D3436" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="55" y1="102" x2="90" y2="98" stroke="#2D3436" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="145" y1="88" x2="110" y2="92" stroke="#2D3436" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="148" y1="95" x2="112" y2="95" stroke="#2D3436" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="145" y1="102" x2="110" y2="98" stroke="#2D3436" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Belly -->
  <ellipse cx="100" cy="148" rx="30" ry="28" fill="#FFDDD2"/>

  <!-- Front legs -->
  <rect x="60" y="170" width="22" height="35" rx="11" fill="#F4A261"/>
  <rect x="118" y="170" width="22" height="35" rx="11" fill="#F4A261"/>

  <!-- Paws -->
  <ellipse cx="71" cy="205" rx="13" ry="9" fill="#F4A261"/>
  <ellipse cx="129" cy="205" rx="13" ry="9" fill="#F4A261"/>

  <!-- Tail -->
  <path d="M155,160 Q185,130 175,100 Q165,75 155,90" stroke="#F4A261" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M155,90 Q148,82 152,75" stroke="#E76F51" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Stripes on body -->
  <path d="M80,125 Q100,118 120,125" stroke="#E76F51" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M75,138 Q100,130 125,138" stroke="#E76F51" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
